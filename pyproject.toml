[project]
name = "tbhb-dot-dev"
version = "0.0.0"
description = "tbhb.dev website."
readme = "README.md"
requires-python = ">=3.14"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = ["codespell>=2.4.1", "prek>=0.2.25", "vale>=3.13.0.0", "yamllint>=1.38.0"]

[tool.codespell]
skip = ".claude,.oaps,node_modules,tmp,pnpm-lock.yaml,dist,uv.lock,*.astro,*.md,*.mdoc"
