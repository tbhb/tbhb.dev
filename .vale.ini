StylesPath = .vale
MinAlertLevel = warning
Vocab = tbhb
Packages = https://github.com/errata-ai/Google/releases/download/v0.6.3/Google.zip, https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip

# Treat Markdoc files as Markdown
[formats]
mdoc = md

[{*.md,*.mdoc}]
BasedOnStyles = Vale, Google, write-good, proselint, tbhb
# Skip inline code
TokenIgnores = (`[^`]+`)
Google.Colons = NO
Google.Exclamation = NO
Google.FirstPerson = NO
Google.Will = NO
proselint.Annotations = NO

# Internal/temporary files - skip linting
[{.claude/**/*.md,.oaps/**/*.md,.vale/**/*.md,tmp/**/*.md}]
BasedOnStyles =
